name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create --org com.example --project-name k_call .
      - run: |
          [ -f lib/pubspec.yaml ] && cp lib/pubspec.yaml pubspec.yaml
          [ -f lib/main.dart ] && cp lib/main.dart lib/main.dart
          mkdir -p android/app
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi
          if [ -f lib/google-services.json ]; then cp lib/google-services.json android/app/google-services.json; fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
