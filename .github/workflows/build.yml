name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create --org com.example --project-name k_call .
      - run: |
          if [ -f lib/pubspec.yaml ]; then cp -f lib/pubspec.yaml pubspec.yaml; fi
          mkdir -p android/app
          if [ -f google-services.json ]; then cp -f google-services.json android/app/google-services.json; fi
          if [ -f lib/google-services.json ]; then cp -f lib/google-services.json android/app/google-services.json; fi
          if [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 23/' android/app/build.gradle
            sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle
            sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = .*/minSdk = 23/' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle.kts
          fi
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
