name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - run: flutter create --org com.example --project-name k_call .
      - run: |
          if [ -f lib/pubspec.yaml ]; then cp -f lib/pubspec.yaml pubspec.yaml; fi
          mkdir -p android/app
          if [ -f google-services.json ]; then cp -f google-services.json android/app/google-services.json; fi
          if [ -f lib/google-services.json ]; then cp -f lib/google-services.json android/app/google-services.json; fi
          python3 -c '
          import glob, re
          for path in glob.glob("android/app/build.gradle*"):
              with open(path, "r") as f:
                  s = f.read()
              is_kts = path.endswith(".kts")
              eq = " = " if is_kts else " "
              s = re.sub(r"(compileSdk(?:Version)?)\s*=?\s*[^\n]+", rf"\1{eq}35", s)
              s = re.sub(r"(minSdk(?:Version)?)\s*=?\s*[^\n]+", rf"\1{eq}23", s)
              if "compileSdk" not in s:
                  s = re.sub(r"(android\s*\{)", rf"\1\n    compileSdk{eq}35", s, count=1)
              with open(path, "w") as f:
                  f.write(s)
          '
          if [ -f android/settings.gradle ]; then
            cat << 'EOF' >> android/settings.gradle

          gradle.beforeProject { project ->
              project.plugins.withId("com.android.application") {
                  project.android.compileSdk = 35
              }
              project.plugins.withId("com.android.library") {
                  project.android.compileSdk = 35
              }
          }
          EOF
          fi
      - run: flutter pub get
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
