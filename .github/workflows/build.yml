name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - run: flutter create --org com.example --project-name k_call .
      - run: |
          if [ -f lib/pubspec.yaml ]; then cp -f lib/pubspec.yaml pubspec.yaml; fi
          mkdir -p android/app
          if [ -f google-services.json ]; then cp -f google-services.json android/app/google-services.json; fi
          if [ -f lib/google-services.json ]; then cp -f lib/google-services.json android/app/google-services.json; fi
          python3 -c '
          import glob, re
          for path in glob.glob("android/app/build.gradle*"):
              with open(path, "r") as f:
                  s = f.read()
              is_kts = path.endswith(".kts")
              eq = " = " if is_kts else " "
              s = re.sub(r"(compileSdk(?:Version)?)\s*=?\s*[^\n]+", rf"\1{eq}35", s)
              s = re.sub(r"(minSdk(?:Version)?)\s*=?\s*[^\n]+", rf"\1{eq}23", s)
              if "compileSdk" not in s:
                  s = re.sub(r"(android\s*\{)", rf"\1\n    compileSdk{eq}35", s, count=1)
              with open(path, "w") as f:
                  f.write(s)
          for path in glob.glob("android/settings.gradle*"):
              with open(path, "r") as f:
                  s = f.read()
              s = re.sub(r"(id\s*\(?[\"\x27]org\.jetbrains\.kotlin\.android[\"\x27]\)?\s+version\s*[\"\x27])[^\"\x27]+([\"\x27])", r"\g<1>2.0.21\2", s)
              with open(path, "w") as f:
                  f.write(s)
          for path in glob.glob("android/build.gradle*"):
              with open(path, "r") as f:
                  s = f.read()
              s = re.sub(r"(ext\.kotlin_version\s*=\s*[\"\x27])[^\"\x27]+([\"\x27])", r"\g<1>2.0.21\2", s)
              with open(path, "w") as f:
                  f.write(s)
          '
      - run: flutter pub get
      - run: |
          python3 -c '
          import glob, re
          for path in glob.glob("/home/runner/.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle"):
              with open(path, "r") as f:
                  s = f.read()
              s = re.sub(r"flutter\.compileSdkVersion", "35", s)
              s = re.sub(r"flutter\.minSdkVersion", "23", s)
              s = re.sub(r"flutter\.targetSdkVersion", "35", s)
              with open(path, "w") as f:
                  f.write(s)
          '
      - run: flutter build apk --release --no-tree-shake-icons
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
